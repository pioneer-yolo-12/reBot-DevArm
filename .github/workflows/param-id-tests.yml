name: Parameter Identification Offline Tests

on:
  pull_request:
    paths:
      - "tools/param_id/**"
      - "pytest.ini"
      - ".github/workflows/param-id-tests.yml"
  push:
    paths:
      - "tools/param_id/**"
      - "pytest.ini"
      - ".github/workflows/param-id-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
      - run: python -m pip install numpy scipy pytest
      - name: Test raw acquisition, identification, validation and controller policies without CAN
        run: python -m pytest -q
